# Control of T-KGAT Stage 2: the point that `tkgat_kg` selected, re-run with the fact dates shuffled over all the triples
# of the t1 KG (one permutation per seed, numpy.random.default_rng(seed); undated facts are shuffled too, the multiset is
# unchanged). At test the t1 triples keep the permuted dates they were trained with; the triples added at t2 keep theirs.
# If this run is as good as `tkgat_kg`, the gain does not come from the fact dates. Report real against permuted.
name: tkgat
time_on: kg
control: permute_kg_ts
seeds: [2019, 2020, 2021, 2022, 2023]
kg: {variant: default}
from_tkgat: tkgat_kg
fixed: {dim: 64, kge_dim: 64, layers: [64, 32, 16], batch_size: 1024, batch_size_kg: 2048,
        max_epochs: 300, eval_every: 5, patience: 10, select_metric: recall@20}
