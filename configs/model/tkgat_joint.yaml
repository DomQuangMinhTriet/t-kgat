# Standalone joint T-KGAT. These parameters are fixed a priori, not selected by a baseline run.
name: tkgat
standalone: true
time_on: both
seeds: [2019, 2020, 2021, 2022, 2023]
kg: {variant: default}
base_point: {lr: 0.001, l2: 0.00001, l2_kg: 0.00001, mess_dropout: 0.1}
grid:
  - {gamma: 1}
  - {gamma: 3}
  - {gamma: 10}
fixed: {dim: 64, kge_dim: 64, layers: [64, 32, 16], batch_size: 1024, batch_size_kg: 2048,
        max_epochs: 300, eval_every: 5, patience: 10, select_metric: recall@20}
