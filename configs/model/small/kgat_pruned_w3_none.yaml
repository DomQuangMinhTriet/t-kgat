# Small-set gate (decision 0016 items 5, 6, 8, 9): KGAT on lastfm-w3 (KG variant pruned), validation only, 3 seeds,
# schedule = none. The lr 1e-4 point is there to test dropping the 1e-4 grid points (item 9).
# Run: python scripts/run.py --data configs/data/lastfm_w3.yaml --model configs/model/small/kgat_pruned_w3_none.yaml --val-only
name: kgat
seeds: [2019, 2020, 2021]
kg: {variant: pruned}
grid:
  - {lr: 0.001,  l2: 0.00001, l2_kg: 0.00001, mess_dropout: 0.1}
  - {lr: 0.001,  l2: 0.0001,  l2_kg: 0.00001, mess_dropout: 0.1}
  - {lr: 0.0001, l2: 0.00001, l2_kg: 0.00001, mess_dropout: 0.1}
fixed: {dim: 64, kge_dim: 64, layers: [64, 32, 16], batch_size: 1024, batch_size_kg: 2048,
        max_epochs: 200, eval_every: 5, patience: 10, select_metric: recall@20}
