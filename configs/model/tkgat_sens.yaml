# Sensitivity of T-KGAT to gamma below the grid of tkgat.yaml (VALIDATION ONLY: run it with `scripts/run.py --val-only`,
# never as an official run). tkgat.yaml selected gamma = 1, the smallest value of {1, 3, 10}, so values between 0 (KGAT) and
# 1 are checked here. Same as tkgat.yaml except for the grid: only gamma is searched, (lr, l2, l2_kg, mess_dropout) are the
# point `kgat` selected on validation for the same data config (results/runs/<run_name>/kgat_summary.json), read by
# scripts/run.py. `fixed`, `kg` and `seeds` equal those of kgat.yaml. The registry key holds the file name, so these rows
# (model "tkgat_sens") never mix with the rows of tkgat.
name: tkgat
seeds: [2019, 2020, 2021, 2022, 2023]
kg: {variant: default}
from_kgat: kgat
grid:
  - {gamma: 0.1}
  - {gamma: 0.3}
fixed: {dim: 64, kge_dim: 64, layers: [64, 32, 16], batch_size: 1024, batch_size_kg: 2048,
        max_epochs: 300, eval_every: 5, patience: 10, select_metric: recall@20}
