# Combined T-KGAT: separate interaction/fact training windows, no absolute tau (decision 0019).
# Gamma is selected on validation; the remaining parameters are inherited from KGAT.
name: tkgat
time_on: both
seeds:
- 2019
- 2020
- 2021
- 2022
- 2023
kg:
  variant: default
from_kgat: kgat
grid:
- gamma: 1
- gamma: 3
- gamma: 10
fixed:
  dim: 64
  kge_dim: 64
  layers:
  - 64
  - 32
  - 16
  batch_size: 1024
  batch_size_kg: 2048
  max_epochs: 300
  eval_every: 5
  patience: 10
  select_metric: recall@20
