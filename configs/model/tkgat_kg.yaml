# T-KGAT Stage 2 (decision 0009, items 7-10): Delta-t on the KG triples instead of the user-item edges. A KG edge carries
# the date from which its fact holds (kg_t*_dates.tsv of scripts/06_build_kg.py); an undated fact has Delta-t = 0 and
# dt_norm is capped at 1. delta_r = 1 for the KG relations and 0 for Interact, so this is a comparison with Stage 1
# (tkgat.yaml), not an addition to it. As in tkgat.yaml only gamma is searched: (lr, l2, l2_kg, mess_dropout) are the
# point `kgat` selected on validation (results/runs/<run_name>/kgat_summary.json). `fixed`, `kg` and `seeds` equal those
# of kgat.yaml. The registry rows hold time_on = kg in `config`.
name: tkgat
time_on: kg
seeds: [2019, 2020, 2021, 2022, 2023]
kg: {variant: default}
from_kgat: kgat
grid:
  - {gamma: 1}
  - {gamma: 3}
  - {gamma: 10}
fixed: {dim: 64, kge_dim: 64, layers: [64, 32, 16], batch_size: 1024, batch_size_kg: 2048,
        max_epochs: 300, eval_every: 5, patience: 10, select_metric: recall@20}
