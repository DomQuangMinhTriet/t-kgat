# Ablation of the combined T-KGAT (decision 0016, item 7): the point that `tkgat_both` selected, with gamma_kg = 0: only the user-item term stays.
# Same seeds and fixed settings as tkgat_both; it is a re-run of one point, not a new search.
name: tkgat
time_on: both
ablate: kg
seeds: [2019, 2020, 2021, 2022, 2023]
kg: {variant: default}
from_tkgat: tkgat_both
fixed: {dim: 64, kge_dim: 64, layers: [64, 32, 16], batch_size: 1024, batch_size_kg: 2048,
        max_epochs: 300, eval_every: 5, patience: 10, select_metric: recall@20}
