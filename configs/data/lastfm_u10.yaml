# Random 10% of the users of Last-FM (all their interactions), for runs on small machines (decision 0008).
# Same protocol as lastfm.yaml: the split, 5-core and checks run on the subset. Sampling is seeded.
name: lastfm            # selects the loader
run_name: lastfm-u10    # registry "dataset" column and results/runs/<run_name>/
raw_dir: data-last-fm/lfm1b-tracks
processed_dir: data/processed/lastfm-u10
clean: false
user_fraction: 0.10
user_seed: 2019
split:
  q_val: 0.8
  q_test: 0.9
  min_rating: 1
  kcore: 5
