# Smaller set (fallback of lastfm_w3.yaml) for choosing hyper-parameters and protocol options (decision 0016 items 1 and 9): the last 2 months of the
# published KGAT pair set (timestamp = earliest listen of the pair). Used for validation-only selection, never for reported
# numbers: the pair set still carries the 2014-04 window of KGAT (0012), the official data comes from the raw LFM-1b.
# Same protocol as lastfm.yaml: the window is cut first, then the split, the 5-core and the checks run inside it.
name: lastfm            # selects the loader
run_name: lastfm-w2     # registry "dataset" column and results/runs/<run_name>/
raw_dir: data-last-fm/lfm1b-tracks
processed_dir: data/processed/lastfm-w2
clean: false
window_months: 2
split:
  q_val: 0.8
  q_test: 0.9
  min_rating: 1
  kcore: 5
