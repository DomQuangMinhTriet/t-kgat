name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff is the version pinned in pyproject.toml and the pre-commit hook
        run: |
          pin=$(grep -A1 'ruff-pre-commit' .pre-commit-config.yaml | grep rev | sed 's/.*v//')
          echo "pre-commit pins ruff $pin; installed: $(ruff --version)"
          test "$(ruff --version | cut -d' ' -f2)" = "$pin"
      - name: Lint
        run: ruff check .
      - name: Tests (leakage tests on real data are skipped when data/raw is absent)
        run: pytest
